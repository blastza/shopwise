name: Deploy Shopwise Microservices

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/auth-service/**'
      - 'backend/product-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/auth-service/**'
      - 'backend/product-service/**'

jobs:
  # This dynamic matrix handles both services concurrently
  build-and-deploy:
    name: Build & Deploy (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            image_name: shopwise-auth
            port: 8081
            db_schema: auth
          - service: product-service
            image_name: shopwise-product
            port: 8082
            db_schema: product

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        working-directory: backend/${{ matrix.service }}
        run: ./mvnw test

      - name: Build JAR File
        working-directory: backend/${{ matrix.service }}
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      # Crucial: Build the image with the target/ JAR we just created above
      - name: Build and Push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to EC2 via SSH
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "📦 Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}:latest
            
            echo "🛑 Stopping old container..."
            docker stop ${{ matrix.image_name }} 2>/dev/null || true
            docker rm ${{ matrix.image_name }} 2>/dev/null || true
            
            echo "▶️ Starting new container..."
            docker run -d \
              --name ${{ matrix.image_name }} \
              --network host \
              --restart unless-stopped \
              -e SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/shopwise_db?currentSchema=${{ matrix.db_schema }}" \
              -e SPRING_DATASOURCE_USERNAME="blastza" \
              -e SPRING_DATASOURCE_PASSWORD="changeme" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JWT_EXPIRATION="86400000" \
              -e SERVER_PORT="${{ matrix.port }}" \
              ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}:latest
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Verifying deployment..."
            sleep 10
            docker ps | grep ${{ matrix.image_name }} && echo "🟢 ${{ matrix.service }} is running" || echo "🔴 ${{ matrix.service }} failed to start"

