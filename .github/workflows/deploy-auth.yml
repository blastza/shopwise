name: Deploy Auth Service

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/auth-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/auth-service/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend/auth-service
        run: ./mvnw test

      - name: Upload test results
        if: always()  # Upload even if tests fail — so you can see what broke
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/auth-service/target/surefire-reports/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test  # Only build if tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        working-directory: backend/auth-service
        run: ./mvnw clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: backend/auth-service/target/*.jar
          retention-days: 5

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build  # Only build image if JAR build passed
    # Only push image on main branch — not on pull requests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/shopwise-auth
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/auth-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker  # Only deploy if image was pushed
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "📦 Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/shopwise-auth:latest
            
            echo "🛑 Stopping old container..."
            docker stop shopwise-auth 2>/dev/null || true
            docker rm shopwise-auth 2>/dev/null || true
            
            echo "▶️ Starting new container..."
            docker run -d \
              --name shopwise-auth \
              --network host \
              --restart unless-stopped \
              -e SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/shopwise_db?currentSchema=auth" \
              -e SPRING_DATASOURCE_USERNAME="blastza" \
              -e SPRING_DATASOURCE_PASSWORD="changeme" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JWT_EXPIRATION="86400000" \
              -e SERVER_PORT="8081" \
              ${{ secrets.DOCKER_USERNAME }}/shopwise-auth:latest
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Verifying deployment..."
            sleep 10
            docker ps | grep shopwise-auth && echo "🟢 Auth service is running" || echo "🔴 Auth service failed to start"
            
            echo "🏥 Health check..."
            curl -f http://localhost:8081/api/auth/health || echo "Health check failed"