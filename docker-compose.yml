version: '3.9'

services:
  # PostgreSQL - Main Database
  postgres:
    image: postgres:16-alpine
    container_name: shopwise-postgres
    environment:
      POSTGRES_USER: blastza
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: shopwise_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U shopwise" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Caching Layer
  redis:
    image: redis:7-alpine
    container_name: shopwise-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

